[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-gemma"
version = "0.1.0"
description = "Reproducible continuous-state reasoning experiments with open language models"
requires-python = ">=3.12"
dependencies = ["mlx==0.32.2", "mlx-lm==0.31.3", "numpy==2.5.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[project.scripts]
latent-gemma = "latent_gemma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
